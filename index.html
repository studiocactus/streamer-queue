<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b00d1" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('watchqueue-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f8f7fb' : '#5b00d1';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta name="application-name" content="WatchQueue" />
    <meta name="description" content="A comunidade escolhe o que o streamer assiste. Envie sugestões, vote nas favoritas e acompanhe a fila do canal." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://streamer-queue.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WatchQueue" />
    <meta property="og:title" content="WatchQueue — Sugestões da comunidade para streamers" />
    <meta property="og:description" content="A comunidade escolhe o que o streamer assiste. Envie sugestões, vote nas favoritas e acompanhe a fila do canal." />
    <meta property="og:url" content="https://streamer-queue.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WatchQueue — Sugestões da comunidade para streamers" />
    <meta name="twitter:description" content="A comunidade escolhe o que o streamer assiste. Envie sugestões, vote nas favoritas e acompanhe a fila do canal." />

</html>
